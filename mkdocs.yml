site_name: SIAI
site_description: Budgeted, auditable improvement loops for machine-learning models
site_url: https://penguinkang.github.io/siai/
repo_url: https://github.com/penguinkang/siai
repo_name: penguinkang/siai
edit_uri: edit/master/docs/

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - SIAI: index.md
  - Learn:
      - First experiment: getting-started.md
      - The improvement loop: concepts/improvement-loop.md
      - Design a model card: concepts/model-card.md
      - Build a proposer: guides/proposer.md
      - Connect a trainer: guides/training.md
      - Run the full loop: guides/workflow.md
  - Reference:
      - Core experiment API: reference/core.md
      - Proposer API: reference/proposer.md
      - Training API: reference/training.md
      - Improvement workflow API: reference/workflow.md
      - Contracts and limitations: design.md
  - Project:
      - v0.1.0 proof of concept: poc.md
      - Research and positioning: research.md
      - Contributing: contributing.md

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/penguinkang/siai
