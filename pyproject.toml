[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "siai"
version = "0.1.0"
description = "Budgeted, auditable model improvement experiments"
requires-python = ">=3.11"
license = {text = "MIT"}

[project.scripts]
siai = "siai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
